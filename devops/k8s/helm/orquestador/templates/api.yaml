apiVersion: apps/v1
kind: Deployment
metadata: { name: orq-api, labels: { app: orq-api } }
spec:
  replicas: {{ .Values.api.replicas }}
  selector: { matchLabels: { app: orq-api } }
  strategy: { type: RollingUpdate, rollingUpdate: { maxUnavailable: 0, maxSurge: 1 } }
  template:
    metadata:
      labels: { app: orq-api }
      annotations: { prometheus.io/scrape: "true", prometheus.io/port: "{{ .Values.api.port }}", prometheus.io/path: /metrics }
    spec:
      securityContext: {{ toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: api
          image: {{ include "orq.image" (dict "root" . "name" "api") }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext: {{ toYaml .Values.securityContext | nindent 12 }}
          ports: [{ containerPort: {{ .Values.api.port }}, name: http }]
          env:
            {{- include "orq.env" . | nindent 12 }}
            - { name: API_HOST, value: "0.0.0.0" }
            - { name: API_PORT, value: {{ .Values.api.port | quote }} }
            - { name: WEB_ORIGIN, value: "https://{{ .Values.global.domain }}" }
          readinessProbe: { httpGet: { path: /readyz, port: http }, periodSeconds: 10, failureThreshold: 3 }
          livenessProbe: { httpGet: { path: /healthz, port: http }, periodSeconds: 20, initialDelaySeconds: 20 }
          resources: {{ toYaml .Values.api.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata: { name: orq-api }
spec:
  selector: { app: orq-api }
  ports: [{ port: 80, targetPort: http, name: http }]
---
{{- if .Values.api.autoscaling.enabled }}
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata: { name: orq-api }
spec:
  scaleTargetRef: { apiVersion: apps/v1, kind: Deployment, name: orq-api }
  minReplicas: {{ .Values.api.autoscaling.minReplicas }}
  maxReplicas: {{ .Values.api.autoscaling.maxReplicas }}
  metrics: [{ type: Resource, resource: { name: cpu, target: { type: Utilization, averageUtilization: {{ .Values.api.autoscaling.targetCPU }} } } }]
---
{{- end }}
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata: { name: orq-api }
spec:
  minAvailable: 2
  selector: { matchLabels: { app: orq-api } }
