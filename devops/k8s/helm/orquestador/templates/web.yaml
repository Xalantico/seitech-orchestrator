apiVersion: apps/v1
kind: Deployment
metadata: { name: orq-web, labels: { app: orq-web } }
spec:
  replicas: {{ .Values.web.replicas }}
  selector: { matchLabels: { app: orq-web } }
  template:
    metadata: { labels: { app: orq-web } }
    spec:
      securityContext: {{ toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: web
          image: {{ include "orq.image" (dict "root" . "name" "web") }}
          securityContext: {{ toYaml .Values.securityContext | nindent 12 }}
          ports: [{ containerPort: 8080, name: http }]
          readinessProbe: { httpGet: { path: /healthz, port: http } }
          resources: {{ toYaml .Values.web.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata: { name: orq-web }
spec:
  selector: { app: orq-web }
  ports: [{ port: 80, targetPort: http }]
