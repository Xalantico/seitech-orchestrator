api:
  dashboard: true
log:
  level: INFO
  format: json
accessLog:
  format: json
  fields:
    headers:
      defaultMode: drop
metrics:
  prometheus:
    addEntryPointsLabels: true
    addRoutersLabels: true
    entryPoint: metrics
ping:
  entryPoint: ping
entryPoints:
  web:
    address: ":80"
    http:
      redirections:
        entryPoint:
          to: websecure
          scheme: https
          permanent: true
  websecure:
    address: ":443"
    http:
      tls: {}
      middlewares:
        - security-headers@file
  metrics:
    address: ":8082"
  ping:
    address: ":8083"
providers:
  docker:
    exposedByDefault: false
    network: orq-edge
    watch: true
  file:
    directory: /etc/traefik/dynamic
    watch: true
