groups:
  - name: orquestador
    rules:
      - alert: ServiceDown
        expr: up == 0
        for: 2m
        labels: { severity: critical }
        annotations: { summary: "{{ $labels.job }} is down" }
      - alert: ApiHighErrorRate
        expr: sum(rate(orq_http_requests_total{status=~"5.."}[5m])) / sum(rate(orq_http_requests_total[5m])) > 0.02
        for: 5m
        labels: { severity: critical }
        annotations: { summary: "API 5xx rate above 2%" }
      - alert: ApiSlowP95
        expr: histogram_quantile(0.95, sum(rate(orq_http_request_duration_seconds_bucket[5m])) by (le)) > 2
        for: 10m
        labels: { severity: warning }
        annotations: { summary: "API p95 latency above 2 s (RNF-01 target)" }
      - alert: OutboxBacklog
        expr: orq_outbox_pending > 500
        for: 10m
        labels: { severity: warning }
        annotations: { summary: "Integration outbox backlog: {{ $value }} events pending" }
      - alert: IntegrationFailures
        expr: sum(rate(orq_integration_calls_total{result="error"}[10m])) by (connector) > 0.1
        for: 10m
        labels: { severity: warning }
        annotations: { summary: "Connector {{ $labels.connector }} is failing" }
      - alert: PostgresConnectionsHigh
        expr: sum(pg_stat_activity_count) > 250
        for: 5m
        labels: { severity: warning }
        annotations: { summary: "PostgreSQL connections above 250" }
      - alert: BackupStale
        expr: time() - orq_last_backup_timestamp_seconds > 129600
        for: 15m
        labels: { severity: critical }
        annotations: { summary: "No successful base backup in the last 36 h" }
