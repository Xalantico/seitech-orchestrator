global:
  scrape_interval: 15s
  evaluation_interval: 15s
alerting:
  alertmanagers: [{ static_configs: [{ targets: ["alertmanager:9093"] }] }]
rule_files: ["/etc/prometheus/alerts.yml"]
scrape_configs:
  - job_name: api
    static_configs: [{ targets: ["api:3001"] }]
  - job_name: worker
    static_configs: [{ targets: ["worker:9464"] }]
  - job_name: temporal
    static_configs: [{ targets: ["temporal:9090"] }]
  - job_name: traefik
    static_configs: [{ targets: ["traefik:8082"] }]
  - job_name: postgres
    static_configs: [{ targets: ["postgres-exporter:9187"] }]
  - job_name: redis
    static_configs: [{ targets: ["redis-exporter:9121"] }]
  - job_name: keycloak
    metrics_path: /metrics
    static_configs: [{ targets: ["keycloak:9000"] }]
  - job_name: minio
    metrics_path: /minio/v2/metrics/cluster
    static_configs: [{ targets: ["minio:9000"] }]
  - job_name: vault
    metrics_path: /v1/sys/metrics
    params: { format: [prometheus] }
    static_configs: [{ targets: ["vault:8200"] }]
