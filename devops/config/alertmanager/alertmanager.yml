route:
  receiver: ops-mail
  group_by: [alertname, job]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
receivers:
  - name: ops-mail
    email_configs:
      - to: ops@orquestador.local
        from: alerts@orquestador.local
        smarthost: mailpit:1025
        require_tls: false
        send_resolved: true
